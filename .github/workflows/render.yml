name: Render London Bridge Video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract Project
        run: |
          unzip -q london_bridge_video_project.zip -d project

      - name: Install Dependencies
        working-directory: project
        run: npm ci

      - name: Setup Browser
        working-directory: project
        run: npx remotion browser ensure

      - name: Render Video
        working-directory: project
        run: |
          mkdir -p out
          npx remotion render src/index.jsx LondonBridge out/london_bridge.mp4 --codec=h264 --gl=angle --concurrency=2 --timeout=180000

      - name: Upload Final Video
        uses: actions/upload-artifact@v4
        with:
          name: London-Bridge-Final-HD
          path: project/out/london_bridge.mp4
          retention-days: 7
